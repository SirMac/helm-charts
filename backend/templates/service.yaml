apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "label.component" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "label.instance" . | nindent 4 }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}  # Service Port
    targetPort: {{ .Values.service.targetPort }} # Container Port