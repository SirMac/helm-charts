apiVersion: apps/v1
name: test-app-frontend
namespace: test-app
labels:
  name: test-app-frontend
  component: frontend
  instance: test-app-frontend

# Deployment configuration
replicas: 1
revisionHistoryLimit: 3
image:
  # docker image name
  repository: frontend-app
  tag: latest
  pullPolicy: Never
strategy:
  type: RollingUpdate
  maxUnavailable: 50%
  maxSurge: 1
resources:
  requests: # minimum resources required
    memory: "20Mi"
    cpu: "50m"
  limits: # maximum resources allowed
    memory: "64Mi"
    cpu: "200m"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Ingress (traefik) configuration
ingress:
  enabled: true
  # setup in /var/lib/rancher/k3s/server/manifests
  entryPoint: web 
  match: PathPrefix(`/`)
  kind: Rule

# Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  kind: Deployment
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
